# The launcher preview app (dm/ios/tools/launcher_preview.py): the iOS launcher's own sources with no game host, so it builds for the iOS Simulator. The tool writes Gen/ (the game's
# dm/launcher.json, its icon, demo icons) and runs xcodegen here. LAUNCHER_DEMO adds made-up games to the library (GameLibrary.swift); only this project defines it.
name: LauncherPreview
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  LauncherPreview:
    type: application
    platform: iOS
    sources:
      - path: PreviewApp.swift
      - path: ../Sources/Launcher.swift
      - path: ../Sources/LauncherHome.swift
      - path: ../Sources/PocketStyle.swift
      - path: ../Sources/LauncherRow.swift
      - path: ../Sources/LauncherSettings.swift
      - path: ../Sources/GameLibrary.swift
      - path: ../Sources/PackArchive.swift
      - path: ../Sources/PackFile.swift
      - path: ../Sources/LauncherFold.m
      - path: ../Sources/CloudSaves.m
      - path: ../Sources/Halfold/hf_kit.c
      - path: Gen/dm
        type: folder
        buildPhase: resources
      - path: Gen/demo
        type: folder
        buildPhase: resources
      - path: Gen/Assets.xcassets
      - path: ../pocket/Logo.xcassets   # NX Pocket's wordmark logo
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: ${DM_DISPLAY_NAME}
        CFBundleShortVersionString: ${DM_APP_VERSION}
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: PreviewSceneDelegate
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.nxpocket.launcher-preview
      PRODUCT_NAME: LauncherPreview
      SWIFT_VERSION: "5.0"
      SWIFT_OBJC_BRIDGING_HEADER: ../Sources/DmIOS-Bridging-Header.h
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LAUNCHER_DEMO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CLANG_ENABLE_OBJC_ARC: YES
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"   # ad hoc: the simulator needs a signature, not a team
