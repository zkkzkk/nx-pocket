# NX Pocket for Mac (xcodegen; dm/mac/pocket/build.sh runs it): makes the player's own Switch games into game packs (.nxpack) and sends them to NX Pocket on an
# iPhone. It runs this checkout's scripts (scripts/build_ipa_from_nsp.py --prepare-xcode, dm/ios/tools/build_pack.py) and xcrun devicectl, so it is not sandboxed.
# Its look is the iPhone app's (dm/ios/Sources/PocketStyle.swift), its icon and logo NX Pocket's (dm/ios/pocket). Some of its model is adapted from NX Play
# (github.com/varyform/nx-native-wrapper, MIT; the notice is in each file that has it).
name: NXPocketMac
options:
  deploymentTarget:
    macOS: "26.0"
targets:
  NXPocketMac:
    type: application
    platform: macOS
    sources:
      - path: App.swift
      - path: Model
      - path: Views
      - path: ../../ios/Sources/PocketStyle.swift
      - path: ../../ios/Sources/PackArchive.swift
      - path: ../../ios/Sources/PackFile.swift
      - path: ../../ios/Sources/LauncherRow.swift        # tr(): the Chinese table
      - path: ../../ios/Sources/LauncherSettings.swift   # (LauncherRow's settings model)
      - path: ../../ios/pocket/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../../ios/pocket/Logo.xcassets
      - path: Assets.xcassets
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: NX Pocket
        CFBundleName: NX Pocket
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: ${DM_MAC_BUILD}       # the checkout's commit count (build.sh), as NX Pocket's (About)
        NXPocketCommit: ${DM_MAC_COMMIT}
        NXPocketToolsVersion: ${DM_MAC_TOOLS_VERSION}   # the tool kit (tools/tools.lock, build.sh): Setup downloads it into Application Support
        NXPocketToolsURL: ${DM_MAC_TOOLS_URL}
        NXPocketToolsSHA256: ${DM_MAC_TOOLS_SHA256}
        NXPocketToolsSize: ${DM_MAC_TOOLS_SIZE}
        NXPocketToolsParts: ${DM_MAC_TOOLS_PARTS}
        NXPocketUpdateKey: ${DM_MAC_UPDATE_KEY}   # release.py keygen's public key (update-key.pub); none: no updates are installed
        LSApplicationCategoryType: public.app-category.games
        CFBundleLocalizations: [en, zh-Hans]   # the system's menus (File, Edit, Window) in Chinese too; the app's own words come from tr()
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "NX Pocket contributors · based on nxnative"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_MAC_BUNDLE_ID}
      PRODUCT_NAME: NX Pocket
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # the sidebar selection: a deeper teal than Palette.accent, so white text reads on it
      SWIFT_VERSION: "5.0"
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      COMBINE_HIDPI_IMAGES: YES
